<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <meta
      name="description"
      content="Versa jewelry store — timeless necklaces, rings, earrings and watches."
    >

    <title>Versa Jewelry Store</title>

    <link rel="stylesheet" href="./css/style.css">
  </head>

  <body>
    <header class="header">
      <div class="container">
        <div class="header__inner">
          <a class="header__logo" href="./index.html" aria-label="Versa home">
            <img
              class="header__logo-image"
              src="./assets/icons/logo.svg"
              alt=""
            >
          </a>
    
          <nav class="header__nav" aria-label="Main navigation">
            <ul class="header__menu">
              <li class="header__menu-item">
                <a class="header__menu-link" href="#">Home</a>
              </li>
    
              <li class="header__menu-item">
                <a class="header__menu-link" href="#">About</a>
              </li>
    
              <li class="header__menu-item">
                <a class="header__menu-link" href="#">Blog</a>
              </li>
    
              <li class="header__menu-item">
                <a class="header__menu-link header__menu-link--accent" href="#">
                  Shop
                </a>
              </li>
    
              <li class="header__menu-item">
                <a class="header__menu-link" href="#">Features</a>
              </li>
    
              <li class="header__menu-item">
                <a class="header__menu-link" href="#">Contacts</a>
              </li>
    
              <li class="header__menu-item">
                <a class="header__menu-link" href="#">Instant Quote</a>
              </li>
            </ul>
          </nav>
    
          <ul class="header__actions" aria-label="Account actions">
            <li class="header__actions-item">
              <a class="header__action" href="#" aria-label="Wishlist">
                <img
                  class="header__action-image header__action-image--heart"
                  src="./assets/icons/heart.svg"
                  alt=""
                >
              </a>
            </li>
    
            <li class="header__actions-item">
              <a class="header__action" href="#" aria-label="Shopping bag">
                <img
                  class="header__action-image"
                  src="./assets/icons/cart.svg"
                  alt=""
                >
              </a>
            </li>
    
            <li class="header__actions-item">
              <a class="header__action" href="#" aria-label="Account">
                <img
                  class="header__action-image"
                  src="./assets/icons/user.svg"
                  alt=""
                >
              </a>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <main>
      
      <section class="hero">
        <div class="container">
          <div class="hero__inner">
            <div class="hero__content">
              <h1 class="hero__title">
                Classic tennis necklace
              </h1>
              <p class="hero__description">
                Cubic zirconias avails in gold chain
              </p>
              <a class="hero__link" href="#">
                View
              </a>
              <div class="hero__controls">
                <div class="hero__arrows">
                  <button class="hero__arrow" type="button" aria-label="Previous slide">
                    <img class="hero__arrow-icon" src="./assets/icons/arrow-left.svg" alt="">
                  </button>
                  <button class="hero__arrow" type="button" aria-label="Next slide">
                    <img class="hero__arrow-icon" src="./assets/icons/arrow-right.svg" alt="">
                  </button>
                </div>
                <div class="hero__pagination" aria-hidden="true">
                  <span class="hero__pagination-item"></span>
                  <span class="hero__pagination-item hero__pagination-item--active"></span>
                  <span class="hero__pagination-item"></span>
                  <span class="hero__pagination-item"></span>
                  <span class="hero__pagination-item"></span>
                </div>
              </div>
            </div>
            <div class="hero__image">
              <img class="hero__image-item" src="./assets/images/hero/hero-image.jpg" alt="Woman wearing a diamond tennis necklace">
            </div>
          </div>
        </div>
      </section>

      <section class="editorial">
        <!-- First editorial feature -->
      </section>

      <section class="editorial editorial--reverse">
        <!-- Second editorial feature -->
      </section>

      <section class="bestsellers">
        <div class="container">
          <!-- Product cards -->
        </div>
      </section>

      <section class="brand-story">
        <div class="container">
          <!-- Swiss Essence -->
        </div>
      </section>

      <section class="jewelry-banner">
        <!-- Decorative image -->
      </section>

      <section class="journal">
        <div class="container">
          <!-- Journal cards -->
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <!-- Footer content -->
      </div>
    </footer>

    <script src="./js/main.js"></script>
  </body>
</html>
